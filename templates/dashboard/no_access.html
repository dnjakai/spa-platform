{% extends "base.html" %}
{% block body %}
<main class="wrap" style="padding-top:64px">
  <div class="card">
    <h1>You don't have access to {{ tenant.name }}</h1>
    <p class="muted">You're signed in as {{ request.user.email }}, which isn't a staff account for this business, or your role can't open this page. Ask the owner to add you.</p>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn">Sign in as someone else</button></form>
  </div>
</main>
{% endblock %}
